<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Regression: site with its own dark theme</title>
<meta name="color-scheme" content="dark">
<style>
  body { background: #0d1117; color: #c9d1d9; font: 16px/1.5 -apple-system, sans-serif; margin: 0; padding: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; padding: 12px; margin-bottom: 12px; }
  a { color: #58a6ff; }
  .light-badge { background: #f0f6fc; color: #24292f; padding: 2px 6px; border-radius: 4px; }
  input { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; padding: 6px; }
</style></head>
<body>
  <h1>Already dark</h1>
  <div class="card"><p>A site that ships its own dark theme. <a href="#a">A link</a>. <span class="light-badge" id="badge">Light badge</span></p></div>
  <div class="card"><input id="dark-input" placeholder="Search"></div>
</body></html>
