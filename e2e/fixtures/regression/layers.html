<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Regression: layers</title>
<style>
  body { background: #ffffff; color: #1d2327; font: 16px/1.4 -apple-system, sans-serif; margin: 0; padding: 24px; min-height: 800px; }
  .panel { background: #fff; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 20px; width: 320px; }
  dialog { border: 0; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.25); padding: 20px; width: 320px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  [popover] { border: 0; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 12px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; }
  .overlay.open { display: grid; place-items: center; }
  .menu { position: absolute; top: 100%; left: 0; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.2); list-style: none; margin: 4px 0 0; padding: 4px 0; display: none; min-width: 180px; }
  .menu.open { display: block; }
  .menu li { padding: 6px 12px; }
  .menu li:hover { background: #f0f0f1; }
  .dd { position: relative; display: inline-block; }
  .tip { position: absolute; bottom: 120%; left: 0; background: #1d2327; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 13px; white-space: nowrap; }
  input { border: 1px solid #c3c4c7; padding: 6px 8px; font: inherit; }
</style></head>
<body>
  <h1>Layers</h1>
  <p><button id="open-dialog">Open dialog</button> <button id="open-popover" popovertarget="pop">Open popover</button> <button id="open-modal">Open custom modal</button></p>
  <div class="dd"><button id="open-menu">Menu ▾</button><ul class="menu" id="menu"><li>Profile</li><li>Settings</li><li>Sign out</li></ul></div>
  <span class="dd" style="margin-left:80px"><span class="tip" id="tip">Copied!</span><button>Copy</button></span>
  <dialog id="dlg"><h2>Delete file?</h2><p>This can't be undone.</p><input id="dlg-input" placeholder="Type DELETE"><form method="dialog"><button id="dlg-close">Cancel</button></form></dialog>
  <div id="pop" popover><strong>Popover</strong><p>Shown in the top layer.</p></div>
  <div class="overlay" id="overlay"><div class="panel" role="dialog" aria-modal="true" id="modal-panel"><h2>Newsletter</h2><p>Get updates by email.</p><input id="modal-input" placeholder="Email"><p><button id="modal-close">Close</button></p></div></div>
  <script>
    document.getElementById('open-dialog').onclick = () => document.getElementById('dlg').showModal();
    document.getElementById('open-modal').onclick = () => document.getElementById('overlay').classList.add('open');
    document.getElementById('modal-close').onclick = () => document.getElementById('overlay').classList.remove('open');
    document.getElementById('open-menu').onclick = () => document.getElementById('menu').classList.toggle('open');
  </script>
</body></html>
