<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: shadow roots</title>
<script>window.__fixtureDone = false;</script>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
</style>
</head>
<body>
<p>Light-DOM paragraph before the components.</p>

<info-card><span>Slotted light-DOM text inside a card.</span></info-card>

<adopted-panel></adopted-panel>

<div id="dsd">
  <template shadowrootmode="open">
    <style>p { background: #fffbe6; color: #3b3b3b; padding: 6px; border: 1px solid #f0e2a8; }</style>
    <p>Declarative shadow DOM text.</p>
  </template>
</div>

<late-box></late-box>

<script>
  customElements.define('info-card', class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' }).innerHTML =
        '<style>:host{display:block;background:#ffffff;color:#2b2b2b;border:1px solid #dcdcdc;padding:8px;margin:8px 0}' +
        'h3{margin:0 0 4px;color:#0b3d91}</style><h3>Card title in shadow</h3><slot></slot>';
    }
  });
  customElements.define('adopted-panel', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      const sheet = new CSSStyleSheet();
      sheet.replaceSync('div{background:#f3f6fa;color:#24292f;padding:8px;border:1px solid #d0d7de}');
      root.adoptedStyleSheets = [sheet];
      root.innerHTML = '<div>Panel styled by an adopted stylesheet.</div>';
    }
  });
  // Defined late: the shadow root appears with no DOM mutation in the document.
  setTimeout(() => {
    customElements.define('late-box', class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' }).innerHTML =
          '<style>p{background:#ffffff;color:#333333;padding:6px;border:1px solid #cccccc}</style><p>Late custom element.</p>';
      }
    });
    window.__fixtureDone = true;
  }, 300);
</script>
</body>
</html>
