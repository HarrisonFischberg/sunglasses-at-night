<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame level 3</title>
<style>
  body { margin: 8px; background: #f4f4f4; color: #1f1f1f; font: 14px/1.4 system-ui, sans-serif; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .tile { display: block; width: 64px; height: 64px; }
  .faded { opacity: 0.5; }
  .pad { display: inline-block; padding: 10px; }
</style>
</head>
<body>
  <div class="row">
    <img id="f3-img" class="tile" data-expect="light" alt="Tile in frame 3" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='64'%20height='64'%3E%3Crect%20width='100%25'%20height='100%25'%20fill='%23e6c896'/%3E%3C/svg%3E">
    <span class="pad"><img id="f3-faded" class="tile faded" data-expect="light" data-alpha="0.5" alt="Half-transparent tile in frame 3" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='64'%20height='64'%3E%3Crect%20width='100%25'%20height='100%25'%20fill='%23e6c896'/%3E%3C/svg%3E"></span>
    <div>
      <p>Frame level 3, nested three deep.</p>
      <button id="f3-btn" type="button" onclick="this.dataset.clicks = (+this.dataset.clicks || 0) + 1">Button in frame 3</button>
    </div>
  </div>
</body>
</html>
