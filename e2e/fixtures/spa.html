<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: single-page app mutations</title>
<script>window.__fixtureDone = false;</script>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; color: #1d1d1d; }
  .item { background: #ffffff; border: 1px solid #e0e0e0; padding: 8px; margin: 6px 0; }
</style>
</head>
<body>
<div id="app"><p>Loading…</p></div>
<script>
  const app = document.getElementById('app');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  (async () => {
    await wait(150);
    // 1. Content rendered by script after load.
    app.innerHTML = '';
    for (let i = 1; i <= 4; i++) {
      const d = document.createElement('div');
      d.className = 'item';
      d.textContent = 'Rendered item ' + i;
      app.appendChild(d);
    }
    await wait(150);
    // 2. A <style> element added later.
    const s = document.createElement('style');
    s.textContent = '.badge{background:#e8f0fe;color:#174ea6;padding:2px 6px;display:inline-block}';
    document.head.appendChild(s);
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = 'New badge';
    app.appendChild(b);
    await wait(150);
    // 3. CSS-in-JS style: rules inserted through the CSSOM (no mutation fires).
    const css = document.createElement('style');
    document.head.appendChild(css);
    css.sheet.insertRule('.late{background:#fffdf5;color:#3d3d3d;border:1px solid #eadfc8;padding:8px}', 0);
    const late = document.createElement('div');
    late.className = 'late';
    late.textContent = 'Styled by an inserted rule';
    app.appendChild(late);
    await wait(150);
    // 4. Inline style changed on an existing element; class toggled.
    app.firstElementChild.style.background = '#f5f5f5';
    app.firstElementChild.style.color = '#2a2a2a';
    app.children[1].classList.add('late');
    // 5. Text replaced inside an existing node.
    app.children[2].textContent = 'Updated item text';
    window.__fixtureDone = true;
  })();
</script>
</body>
</html>
