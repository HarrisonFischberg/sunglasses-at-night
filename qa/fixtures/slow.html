<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA slow load</title>
<script src="/probe.js"></script>
<link rel="stylesheet" href="/slow.css?delay=1500">
<style>body{margin:0;font:17px/1.5 -apple-system,system-ui,sans-serif;background:#fff;color:#111}main{padding:16px}</style>

<main>
<h1 data-qa-text="h1">Slow page</h1>

</main>
